name: Package contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: jdx/mise-action@v2
      - name: Tool versions
        run: |
          xcodebuild -version
          swift --version
          tuist version
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Package checks
        run: |
          swift package resolve
          swift test
          swift build -c release
      - name: Tuist workspace
        working-directory: Example
        run: |
          tuist install
          tuist generate --no-open
      - name: Tuist unit tests
        run: xcodebuild -workspace Example/SpiralOfFifthsDemo.xcworkspace -scheme TheoryDiagramsUnitTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Demo build
        run: xcodebuild -workspace Example/SpiralOfFifthsDemo.xcworkspace -scheme SpiralOfFifthsDemo -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
